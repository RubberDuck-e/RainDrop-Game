<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main Menu -->
    <div id="mainMenu" class="menu">
      <h1>Money Rain</h1>
      <button onclick="startGame()">Start Game</button>
      <p id="lastGameScore"></p> <!-- Placeholder for the last game's score -->
  </div>
  
  <!-- This is where we will display the dynamic text -->
  <div id="dynamicTextContainer">
    <p id="dynamicText"><!-- placeholder for the games displayed scorre--></p>
  </div>

  <!-- Game Box-->
    <div id="gameContainer" class="game" tabindex="-1">  
      <img id="man" src="imgs/businessmanLeft.png" alt="man" tabindex="-1">
      <img id="umbrella" src="imgs/UmbrellaOpen.png" alt="umbrella" tabindex="-1">
      <div id="items" tabindex="-1"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
